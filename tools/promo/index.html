<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIC · 宣传片素材排练</title>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/preview.css">
</head>
<body data-aic-theme data-ds-dark-theme data-aic-motion="on" data-aic-decoration="on" data-aic-run-fx="on" data-aic-running="false" data-scene="hero">
  <main data-content-phase="hero">
    <header class="film-header"><span><img src="/icon.svg" alt="" width="26" height="26"><b>AIC</b><i>CONTROL / UI</i></span><small>DSH NEXT THEME · V0.9.3</small></header>
    <section class="film-copy" aria-live="polite">
      <p class="film-kicker">01 / ENGINEERING CANVAS</p>
      <h1>让界面，进入秩序。</h1>
      <p class="film-description">半透明空心菱形 · 四边刻度 · 鼠标视差</p>
    </section>
    <section class="film-composer" data-composer-card aria-label="输入栏视觉演示">
      <p>描述你想构建的内容， / 调用指令， @ 文件或对话</p>
      <div class="film-composer-footer"><span>＋</span><span>工作区内修改</span><span class="film-depth-label">运算深度</span><span class="film-depth-note">逐格扫描</span><span class="film-send">↑</span></div>
    </section>
    <div class="film-palette" aria-label="配色示例"><span>青绿 / 砂金</span><span>赤红 / 砂金</span><span>灰紫 / 冰蓝</span></div>
    <a class="film-url" href="https://github.com/Return761/aic-console-theme">github.com/Return761/aic-console-theme</a>
    <footer class="film-footer"><span>VISUAL DEMONSTRATION / 视觉演示</span><span class="film-state">待机 · 未连接 Agent</span></footer>
  </main>
  <div class="aic-run-bar" aria-hidden="true"></div>
  <nav class="film-controls" aria-label="素材排练控制">
    <button data-scene-button="hero">1 菱形</button><button data-scene-button="input">2 输入栏</button><button data-scene-button="palette">3 配色</button><button data-scene-button="run">4 运行光带</button><button data-scene-button="outro">5 片尾</button>
    <button data-action="palette">P 换色</button><button data-action="mode">L 深浅</button><button data-action="running">R 启停预览</button><button data-action="motion">M 动效</button><button data-action="hide">H 隐藏控制</button><button data-action="fullscreen">F 全屏</button>
  </nav>
  <script type="module" src="/preview.js"></script>
</body>
</html>
